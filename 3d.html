<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAR PLAY 3D</title><style>
*{box-sizing:border-box}body{margin:0;background:#090d15;color:#fff;font:15px system-ui;overscroll-behavior:none}main{max-width:850px;margin:auto;padding:10px}header{display:flex;justify-content:space-between;align-items:center;color:#e8c587;letter-spacing:2px;font-weight:800}a{color:#e8c587}#stage{position:relative;height: min(68dvh,730px);min-height:240px;margin:10px 0;border:1px solid #46516b;border-radius:16px;overflow:hidden}#view{width:100%;height:100%;display:block;touch-action:none}#hud{position:absolute;inset:12px 12px auto;display:flex;justify-content:space-between;gap:10px;text-shadow:0 2px 7px #000;pointer-events:none}#hud b{display:block;font-size:25px}small{color:#b5c2d5;font-size:11px}#panel{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;background:linear-gradient(0deg,#080d18ef 0%,#080d18c0 35%,#080d1810 100%);text-align:center;gap:8px;overflow:auto}#panel[hidden], [hidden]{display:none!important}h1{font-size:clamp(26px,8vw,52px);line-height:1;margin:0}p{margin:5px 0;color:#d3dbea}button,select{font:700 16px system-ui;border:0;border-radius:12px;padding:14px;background:#e6c58d;color:#131722;touch-action:manipulation}button:disabled{opacity:.45}select{background:#1c2738;color:white;border:1px solid #748098}#controls{display:grid;grid-template-columns:1fr 1.3fr 1fr;gap:8px}#controls button{height:65px;font-size:22px}#nitro{background:#167eaa;color:white}#meter{height:8px;background:#273443;border-radius:6px;overflow:hidden;margin:10px 0}#charge{height:100%;background:linear-gradient(90deg,#27a7ff,#9afcff);width:100%}#giftNote{color:#ffe0a0}#notice{position:absolute;top:23%;left:0;right:0;text-align:center;color:#ffd68a;font-size:24px;font-weight:900;text-shadow:0 2px 8px #000;pointer-events:none}#panel a{font-weight:700} @media(orientation:landscape) and (max-height:500px){main{max-width:none;display:grid;grid-template-columns:1fr 195px;gap:10px}header{grid-column:1/-1}#stage{height:7 </style></head><body><main><header><a href="./">TAR PLAY</a><small>3D LAB / 0.1</small></header><div id="stage"><canvas id="view"></canvas><div id="hud"><span><small>КМ/Ч</small><b id="speed">0</b></span><span><small>ДИСТАНЦИЯ</small><b id="dist">0 м</b></span><span><small>УРОВЕНЬ</small><b id="level">1</b></span></div><div id="notice" hidden></div><div id="panel"><small>NIGHT DISTRICT</small><h1 id="title">STREET<br>RACING 3D</h1><p id="desc">Загрузка 3D-движка…</p><p id="giftNote" hidden></p><label id="paintLabel" hidden>Оформление <select id="paint"><option value="blue">Midnight Blue</option><option value="gold" disabled>TAR Gold Edition</option></select></label><button id="start" disabled>На старт</button><button id="share" hidden>Поделиться результатом</button><a href="street.html">Вернуться в классические гонки</a></div></div><div><div id="controls"><button id="left">◀</button><button id="nitro">⚡ НИТРО</button><button id="right">▶</button></div><div id="meter"><div id="charge"></div></div><small id="status">Три полосы • 3 жизни • чекпойнт каждые 500 м</small></div></main>
<script src="https://cdn.babylonjs.com/babylon.js"></script><script>
"use strict";const $=id=>document.getElementById(id);function storage(k,v){try{if(v!==undefined)localStorage.setItem(k,v);return localStorage.getItem(k)}catch{return null}}let gift=new URLSearchParams(location.search).get("gift")==="gold-demo";if(gift){storage("tar3dGold","1");$("giftNote").hidden=false;$("giftNote").textContent="Подарок открыт: TAR Gold Edition (демо)"}let hasGold=gift||storage("tar3dGold")==="1";if(hasGold){$("paint").options[1].disabled=false;$("paint").value="gold"}function fail(){ $("desc").textContent="Не удалось запустить 3D. Проверь интернет или открой классические гонки."; $("start").disabled=true }try{if(!window.BABYLON)throw Error("engine unavailable");init()}catch(e){console.error(e);fail()}
function init(){const B=BABYLON,canvas=$("view"),engine=new B.Engine(canvas,true,{preserveDrawingBuffer:false,stencil:true,adaptToDeviceRatio:false});engine.setHardwareScalingLevel(Math.max(1,Math.min(2,devicePixelRatio/1.25||1)));const scene=new B.Scene(engine);scene.clearColor=new B.Color4(.025,.045,.09,1);scene.fogMode=B.Scene.FOGMODE_EXP2;scene.fogDensity=.006;scene.fogColor=new B.Color3(.07,.09,.16);const V=(x,y,z)=>new B.Vector3(x,y,z),C=(r,g,b)=>new B.Color3(r,g,b);let camera=new B.FreeCamera("chase",V(0,4.2,-8.8),scene);camera.setTarget(V(0,1.2,15));camera.minZ=.1;camera.maxZ=300;camera.fov=.92;const ambient=new B.HemisphericLight("sky",V(0,1,0),scene);ambient.intensity=.85;ambient.groundColor=C(.13,.16,.25);const key=new B.DirectionalLight("key",V(-.5,-1,.6),scene);key.intensity=1.7;key.diffuse=C(.56,.75,1);const rim=new B.DirectionalLight("rim",V(.8,-.3,-.5),scene);rim.diffuse=C(1,.35,.25);rim.intensity=.7;
function mat(name,color,shine=0,emit=0){let m=new B.StandardMaterial(name,scene);m.diffuseColor=color;m.specularColor=C(shine,shine,shine);m.specularPower=64;if(emit)m.emissiveColor=color.scale(emit);return m}const asphalt=mat("asphalt",C(.075,.085,.105),.36),ground=mat("ground",C(.035,.043,.065)),line=mat("lane",C(.75,.83,.9),.1,.18),edge=mat("edge",C(.2,.65,.95),.1,.7),tire=mat("rubber",C(.025,.03,.035)),metal=mat("alloy",C(.55,.58,.62),.8),glass=mat("glass",C(.04,.1,.16),.9),red=mat("tail",C(1,.04,.08),.1,1.2),white=mat("head",C(.7,.85,1),.1,1.3),blue=mat("nitro",C(.05,.7,1),.1,1.6),black=mat("trim",C(.025,.03,.04),.35),gold=mat("gold",C(.82,.49,.11),.95),paint=mat("blue",C(.04,.22,.65),.95);
function box(n,w,h,d,x,y,z,m,parent){let q=B.MeshBuilder.CreateBox(n,{width:w,height:h,depth:d},scene);q.position=V(x,y,z);q.material=m;if(parent)q.parent=parent;return q}box("base",250,.15,260,0,-.17,100,ground);box("road",10.6,.12,260,0,-.07,100,asphalt);
const road=[];for(let i=0;i<32;i++){let z=i*8-16,root=new B.TransformNode("segment"+i,scene);root.position.z=z;for(let x of [-1.76,1.76])box("dash",.09,.018,3.8,x,.008,0,line,root);for(let side of [-1,1]){box("edge",.12,.03,7.8,side*5.3,.015,0,edge,root);if(i%3===0){box("pole",.08,4.8,.08,side*6.2,2.4,0,metal,root);box("lamp",1.1,.12,.22,side*5.75,4.75,0,white,root)}}road.push(root)}
const buildings=[],walls=[mat("facade1",C(.065,.09,.14),.25),mat("facade2",C(.1,.09,.16),.25)],windowM=[mat("windowsBlue",C(.1,.55,.85),0,.7),mat("windowsAmber",C(.9,.55,.16),0,.7)];for(let i=0;i<18;i++){let root=new B.TransformNode("block"+i,scene);root.position.z=i*14-15;for(let side of [-1,1]){let ht=7+(i*13%12),x=side*(10+i%3*2);box("tower",5.6,ht,9,x,ht/2,0,walls[i%2],root);for(let k=0;k<4;k++)for(let j=0;j<3;j++)box("window",.025,.42,.75,x-side*2.81,2+k*1.4,-2.7+j*2,windowM[(i+j)%2],root);if(i%4===0)box("neon",.08,1.3,3,x-side*2.86,2.2,0,windowM[(i+1)%2],root)}buildings.push(root)}
function car(n,m){const root=new B.TransformNode(n,scene);let body=box("body",1.85,.55,3.7,0,.55,0,m,root);box("bonnet",1.76,.22,1.1,0,.86,.99,m,root);box("trunk",1.82,.19,.9,0,.83,-1.31,m,root);let cabin=box("cabin",1.48,.57,1.65,0,1.04,.05,glass,root);box("roof",1.36,.13,1.1,0,1.37,.1,m,root);box("bumper",1.78,.22,.24,0,.38,-1.86,black,root);box("plate",.39,.15,.025,0,.58,-1.985,white,root);for(let s of [-1,1]){box("tail",.57,.14,.035,s*.59,.79,-1.82,red,root);box("head",.58,.13,.04,s*.58,.78,1.86,white,root);box("exhaust",.2,.12,.1,s*.58,.29,-1.94,metal,root);for(let z of [-1.13,1.13]){let wheel=B.MeshBuilder.CreateCylinder("wheel",{height:.29,diameter:.7,tessellation:18},scene);wheel.rotation.z=Math.PI/2;wheel.position=V(s*.88,.36,z);wheel.material=tire;wheel.parent=root;let hub=B.MeshBuilder.CreateCylinder("hub",{height:.03,diameter:.39,tessellation:12},scene);hub.rotation.z=Math.PI/2;hub.position=V(s*1.04,.36,z);hub.material=metal;hub.parent=root}}return root}
const player=car("player",paint),spoiler=box("wing",1.95,.075,.35,0,1.13,-1.52,black,player);const supports=[-1,1].map(s=>box("wing support",.08,.26,.1,s*.65,1,-1.52,black,player));let flame=box("flame",.85,.1,1.1,0,.27,-2.45,blue,player);flame.setEnabled(false);function appearance(){let isGold=$("paint").value==="gold"&&hasGold;for(let q of player.getChildMeshes())if(q.material===paint||q.material===gold)q.material=isGold?gold:paint;spoiler.setEnabled(isGold);supports.forEach(q=>q.setEnabled(isGold))}$("paint").onchange=appearance;appearance();
let mode="idle",lane=0,speed=0,distance=0,level=1,hp=3,energy=100,boost=0,hit=0,spawn=.5,traffic=[],age=0,noticeUntil=0,lastScore=0,record=Number(storage("tar3dRecord"))||0;const trafficM=[mat("trafficRed",C(.55,.05,.1),.55),mat("trafficWhite",C(.63,.7,.79),.5),mat("trafficGrey",C(.15,.18,.22),.5)];function clearTraffic(){for(let o of traffic)o.root.dispose(false,false);traffic=[]}function move(d){if(mode==="run")lane=Math.max(-1,Math.min(1,lane+d))}function nitro(){if(mode==="run"&&energy>=25&&boost<=0){energy-=25;boost=2.4}}$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);$("nitro").onclick=nitro;addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," "].includes(e.key)&&!["SELECT","BUTTON"].includes(document.activeElement.tagName)){e.preventDefault();if(!e.repeat){if(e.key==="ArrowLeft")move(-1);else if(e.key==="ArrowRight")move(1);else nitro()}}});
function start(){if(mode==="run"||mode==="count")return;clearTraffic();distance=0;level=1;hp=3;energy=100;boost=hit=age=0;spawn=.6;lane=0;player.position.x=0;mode="count";$("share").hidden=true;$("paintLabel").hidden=true;$("start").hidden=true;$("giftNote").hidden=true;$("desc").textContent="Приготовься";let n=3;$("title").textContent=n;let timer=setInterval(()=>{if(--n>0)$("title").textContent=n;else{clearInterval(timer);mode="run";speed=200;$("panel").hidden=true}},1000)}$("start").onclick=start;$("start").disabled=false;$("paintLabel").hidden=false;$("desc").textContent="Выбери оформление. Выживай, объезжай трафик и проходи чекпойнты.";function finish(){mode="end";flame.setEnabled(false);lastScore=Math.floor(distance);if(lastScore>record){record=lastScore;storage("tar3dRecord",record)}$("title").textContent="ГОНКА ОКОНЧЕНА";$("desc").textContent=lastScore+" м • Уровень "+level+" • Рекорд "+record+" м";$("start").textContent="Ещё раз";$("start").hidden=false;$("share").hidden=false;$("paintLabel").hidden=false;$("panel").hidden=false;$("notice").hidden=true}$("share").onclick=async()=>{let text="Мой результат TAR PLAY 3D: "+lastScore+" м. https://andtar86-ai.github.io/tar-play/3d.html";try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);alert("Скопировано")}}catch(e){if(e.name!=="AbortError")prompt("Скопируй результат",text)}};
engine.runRenderLoop(()=>{let dt=Math.min(.05,engine.getDeltaTime()/1000);if(mode==="run"){age+=dt;boost=Math.max(0,boost-dt);hit=Math.max(0,hit-dt);energy=Math.min(100,energy+dt*4);let base=Math.min(320,210+(level-1)*15),target=hit>0?90:base+(boost>0?75:0);speed+=(target-speed)*Math.min(1,dt*3);let dz=speed/3.6*dt;distance+=dz;let next=1+Math.floor(distance/500);if(next>level){level=next;noticeUntil=age+2;$("notice").textContent="CHECKPOINT • "+level}$("notice").hidden=age>=noticeUntil;player.position.x+=(lane*3.45-player.position.x)*Math.min(1,dt*12);player.rotation.z=(lane*3.45-player.position.x)*-.055;for(let r of road){r.position.z-=dz;if(r.position.z< -20)r.position.z+=256}for(let r of buildings){r.position.z-=dz;if(r.position.z< -25)r.position.z+=252}spawn-=dt;if(spawn<=0){spawn=Math.max(.6,1.35-(level-1)*.07)+Math.random()*.35;let root=car("traffic",trafficM[Math.floor(Math.random()*3)]);root.position=V((Math.floor(Math.random()*3)-1)*3.45,0,115);traffic.push({root,passed:false})}for(let o of traffic){let prev=o.root.position.z;o.root.position.z-=dz*.7;if(!o.passed&&prev>3.1&&o.root.position.z<=3.1){o.passed=true;if(Math.abs(o.root.position.x-player.position.x)<1.8&&hit<=0){hp--;hit=1.2;boost=0;speed=60}}}traffic=traffic.filter(o=>{if(o.root.position.z< -15){o.root.dispose(false,false);return false}return true});flame.setEnabled(boost>0);camera.fov+=( (boost>0?1.08:.92)-camera.fov)*Math.min(1,dt*5);camera.position.x=player.position.x*.18+(hit>0?Math.sin(age*55)*.08:0);camera.setTarget(V(player.position.x*.25,1.2,15));if(hp<=0)finish()}else if(mode==="idle"||mode==="end"){camera.position=V(Math.sin(performance.now()*.00055)*3,3.3,-7.5);camera.setTarget(V(0,.65,0))}if(mode==="count"){camera.position=V(0,4.2,-8.8);camera.setTarget(V(0,1.2,15))}$("speed").textContent=Math.round(speed);$("dist").textContent=Math.floor(distance)+" м";$("level").textContent=level;$("charge").style.width=energy+"%";$("status").textContent="Жизни: "+("♥ ".repeat(hp))+" • Нитро: "+Math.floor(energy)+"%";$("nitro").disabled=mode!=="run"||energy<25||boost>0;scene.render()});addEventListener("resize",()=>engine.resize());}
</script></body></html>
