астёт.</p><div id="garage"><div id="cards" role="group" aria-label="Выбор автомобиля"></div><small>Одинаковая скорость у всех. Выбирай стиль.</small></div><button id="start">На старт</button><a id="offer" hidden href="https://andrei-tar.ru/" target="_blank" rel="noopener">Хочу такой праздник</a><button id="share" hidden style="margin-top:8px">Поделиться</button></div></div><div><div class="controls"><button id="left" aria-label="Влево">◀</button><button class="nitro" id="nitro">⚡ НИТРО</button><button id="right" aria-label="Вправо">▶</button></div><div class="meter"><i id="charge"></i></div><small id="status">Три полосы • 3 жизни • без ограничения времени</small></div></main><script>
"use strict";const $=id=>document.getElementById(id),c=$("c"),g0=c.getContext("2d");let g=g0;const models={bmw:{name:"BMW",color:"#2873ba",pack:"Люкс"},mercedes:{name:"Mercedes",color:"#b8c4ce",pack:"Премиум"},audi:{name:"Audi",color:"#bd283e",pack:"Классика"},lada:{name:"Lada Kalina",color:"#d9b36a",pack:"Лайт"}};let model="bmw",level=1,checkpointUntil=0,elapsedRun=0;let W=360,H=500,mode="idle",lane=0,xlane=0,speed=0,dist=0,remaining=30,energy=100,boost=0,hp=3,hit=0,traffic=[],spawn=0,last=0,record=0,runId=0,finalScore=0;try{record=+localStorage.getItem("tarStreet05")||0}catch{}function resize(){let b=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=b.width;H=b.height;c.width=Math.round(W*d);c.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0)}window.addEventListener("resize",resize);resize();function poly(points,color){g.fillStyle=color;g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill()}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function project(z,l){let t=1/(1+z/110),y=H*.29+t*H*.64,half=W*.49*t;return {x:W/2+l*half*.64,y,half,t}}function car(x,y,w,color,player,variant){const kind=variant||(player?model:"traffic"),k=kind==="traffic"?"audi":kind;g.save();g.translate(x,y);g.scale(w/100,w/100);let specs={bmw:{body:[[-52,-8],[-51,-30],[-47,-39],[-31,-44],[-24,-59],[-18,-65],[18,-65],[24,-59],[31,-44],[47,-39],[51,-30],[52,-8],[44,0],[-44,0]],glass:[[-30,-45],[-20,-61],[20,-61],[30,-45]],width:52},mercedes:{body:[[-50,-8],[-50,-27],[-45,-38],[-32,-43],[-22,-59],[-14,-63],[14,-63],[22,-59],[32,-43],[45,-38],[50,-27],[50,-8],[39,0],[-39,0]],glass:[[-29,-44],[-19,-59],[19,-59],[29,-44]],width:50},audi:{body:[[-50,-8],[-49,-32],[-39,-43],[-26,-58],[-15,-64],[15,-64],[26,-58],[39,-43],[49,-32],[50,-8],[41,0],[-41,0]],glass:[[-33,-44],[-17,-60],[17,-60],[33,-44]],width:50},lada:{body:[[-43,-5],[-44,-34],[-41,-56],[-34,-69],[-27,-73],[27,-73],[34,-69],[41,-56],[44,-34],[43,-5],[35,0],[-35,0]],glass:[[-31,-42],[-30,-65],[30,-65],[31,-42]],width:44}};let s=specs[k],a=s.width;let shade=g.createRadialGradient(0,0,5,0,0,57);shade.addColorStop(0,"#000d");shade.addColorStop(1,"#0000");g.save();g.scale(1,.25);g.fillStyle=shade;g.fillRect(-60,-50,120,100);g.restore();for(let side of [-1,1]){rect(side*(a-7)-6,-23,12,25,"#07090c");rect(side*(a-7)-4,-2,8,3,"#42454a")}let paint=g.createLinearGradient(0,-73,0,0);paint.addColorStop(0,"#b9d0e1");paint.addColorStop(.18,color);paint.addColorStop(.43,color);paint.addColorStop(.55,"#ffffff99");paint.addColorStop(.57,color);paint.addColorStop(.86,color);paint.addColorStop(1,"#151a22");poly(s.body,paint);let glass=g.createLinearGradient(0,-70,0,-40);glass.addColorStop(0,"#567387");glass.addColorStop(.45,"#192c3d");glass.addColorStop(1,"#070e18");poly(s.glass,glass);g.strokeStyle="#bad3e449";g.lineWidth=.8;g.beginPath();s.glass.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.stroke();if(k==="lada"){rect(-29,-45,58,1,"#687887");rect(-3,-49,24,1.8,"#101317");poly([[-40,-36],[40,-36],[38,-9],[-38,-9]],color);rect(-36,-8,72,6,"#343b43");rect(-11,-29,22,8,"#e1e5e7");rect(27,-3,8,3,"#aaa")}else{poly([[-a+4,-36],[-28,-32],[28,-32],[a-4,-36],[a-5,-12],[-a+5,-12]],color);poly([[-a+5,-9],[-27,-13],[27,-13],[a-5,-9],[a-10,0],[-a+10,0]],"#171c25");rect(-12,-20,24,8,"#e3e6e9");if(k==="bmw"){rect(-44,-42,88,3,"#10141b");for(let t of [-36,-24,16,28])rect(t,-4,8,4,"#b7c5ce")}else if(k==="mercedes"){rect(-36,-35,72,1.5,"#e2e6eb");rect(-38,-5,17,3,"#b7c5ce");rect(21,-5,17,3,"#b7c5ce")}else{rect(-39,-40,78,2,"#aab4bd");rect(-34,-4,12,3,"#bac5cd");rect(22,-4,12,3,"#bac5cd")}}g.shadowColor="#ff263c";g.shadowBlur=7;if(k==="lada"){for(let side of [-1,1]){let lx=side<0?-42:32;rect(lx,-40,10,25,"#a71d2c");rect(lx+1,-38,8,9,"#ff4654");rect(lx+1,-24,8,4,"#ffd7bb")}}else if(k==="audi"){rect(-44,-31,88,2,"#ff5060");for(let side of [-1,1])for(let j=0;j<5;j++)rect(side<0?-43+j*5:19+j*5,-29,3,5,"#ff334a")}else if(k==="mercedes"){for(let side of [-1,1]){g.save();g.scale(side,1);poly([[15,-31],[45,-34],[46,-27],[21,-23]],"#ff344d");poly([[19,-30],[43,-32],[42,-29],[23,-26]],"#ffb3b3");g.restore()}}else{for(let side of [-1,1]){g.save();g.scale(side,1);poly([[16,-32],[46,-34],[46,-22],[40,-20],[40,-27],[16,-27]],"#ff344d");g.restore()}}g.shadowBlur=0;if(k!=="traffic"){g.fillStyle="#18212b";g.font="bold 5px sans-serif";g.textAlign="center";g.fillText("TAR PLAY",0,k==="lada"?-23:-14);g.fillStyle="#bfc9d2";g.beginPath();g.arc(0,k==="lada"?-35:-25,2.3,0,Math.PI*2);g.fill()}if(player&&boost>0){for(let side of [-1,1]){let lx=side*29;let flame=g.createLinearGradient(0,0,0,28);flame.addColorStop(0,"#fff");flame.addColorStop(.2,"#56eaff");flame.addColorStop(1,"#376bff00");poly([[lx-4,0],[lx+4,0],[lx,20+Math.random()*12]],flame)}}g.restore()}function scene(){let sky=g.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,"#050916");sky.addColorStop(1,"#4e3157");rect(0,0,W,H,sky);let horizon=H*.29;for(let i=0;i<22;i++){let bw=W/19,bh=H*(.045+((i*43)%97)/650),x=i*bw-W*.05;rect(x,horizon-bh,bw-3,bh,"#10182a");for(let j=0;j<4;j++)for(let k=0;k<3;k++)if((i+j+k)%3===0)rect(x+4+k*bw*.23,horizon-bh+6+j*bh*.19,2,4,i%2?"#66b7d9":"#e0a66b")}rect(0,horizon,W,H-horizon,"#111925");poly([[W*.49,horizon],[W*.51,horizon],[W*1.1,H],[-W*.1,H]],"#272b36");for(let side of [-1,1]){poly([[W*.5+side*2,horizon],[W*.5+side*4,horizon],[W*.5+side*W*.55,H],[W*.5+side*W*.53,H]],"#a5a8a9")}let wet=g.createLinearGradient(0,horizon,0,H);wet.addColorStop(0,"#71628235");wet.addColorStop(1,"#111d3566");poly([[W*.49,horizon],[W*.51,horizon],[W*1.1,H],[-W*.1,H]],wet);for(let i=0;i<14;i++){let z=850-((i*64+dist*.9)%850),p=project(z,0);for(let side of [-1,1]){let x=p.x+side*p.half*.84;poly([[x-2*p.t,p.y],[x+2*p.t,p.y],[x+12*p.t,p.y+H*.12*p.t],[x-9*p.t,p.y+H*.12*p.t]],i%2?"#38b8ff24":"#eb529c20")}}let cz=500-dist%500;if(cz<430){let q=project(cz,0);rect(q.x-q.half,q.y-H*.32*q.t,4*q.t,H*.32*q.t,"#a0a8bb");rect(q.x+q.half,q.y-H*.32*q.t,4*q.t,H*.32*q.t,"#a0a8bb");rect(q.x-q.half,q.y-H*.32*q.t,q.half*2,22*q.t,"#b89650");g.fillStyle="#111";g.font="bold "+Math.max(5,14*q.t)+"px sans-serif";g.textAlign="center";g.fillText("CHECKPOINT "+level,q.x,q.y-H*.32*q.t+15*q.t)}let offset=(dist*1.2)%34;for(let z=900-offset;z>0;z-=34){let a=project(z,0),b=project(Math.max(0,z-16),0);for(let l of [-.5,.5])poly([[a.x+l*a.half*.64-1,a.y],[a.x+l*a.half*.64+1,a.y],[b.x+l*b.half*.64+2*b.t,b.y],[b.x+l*b.half*.64-2*b.t,b.y]],"#c7cbd3");let s=project(z,0);for(let side of [-1,1]){let px=s.x+side*s.half*1.08,ph=H*.16*s.t;rect(px,s.y-ph,Math.max(1,3*s.t),ph,"#626a78");rect(px-4*s.t,s.y-ph,12*s.t,3*s.t,"#79ddff")}}for(const o of [...traffic].sort((a,b)=>b.z-a.z)){let p=project(o.z,o.lane);car(p.x,p.y,W*.24*p.t,o.color,false)}let p=project(0,xlane);if(hit<=0||Math.floor(hit*12)%2===0)car(p.x+(hit>0?Math.sin(hit*50)*3:0),p.y+Math.sin(dist*.2)*1.5,W*.29,models[model].color,true);if(boost>0){g.strokeStyle="#64ddff77";for(let i=0;i<10;i++){let sx=i*W/9;g.beginPath();g.moveTo(W/2+(sx-W/2)*.65,H*.66);g.lineTo(sx,H);g.stroke()}}}
function move(d){if(mode==="run")lane=Math.max(-1,Math.min(1,lane+d))}function nitro(){if(mode==="run"&&energy>=25&&boost<=0){energy-=25;boost=2.3}}$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);$("nitro").onclick=nitro;window.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," "].includes(e.key)){e.preventDefault();if(!e.repeat){if(e.key==="ArrowLeft")move(-1);else if(e.key==="ArrowRight")move(1);else nitro()}}});function start(){ $("offer").hidden=true;level=1;elapsedRun=0;checkpointUntil=0;$("checkpoint").hidden=true;$("garage").hidden=true;runId++;let token=runId;lane=xlane=0;speed=dist=0;remaining=30;hp=3;energy=100;boost=hit=0;traffic=[];spawn=.8;mode="count";$("share").hidden=true;$("start").hidden=true;$("overlay").hidden=false;$("desc").textContent="Приготовься";let n=3;$("title").textContent=n;function count(){if(token!==runId)return;if(--n>0){$("title").textContent=n;setTimeout(count,1000)}else{mode="run";speed=145;$("overlay").hidden=true;last=performance.now()}}setTimeout(count,1000)}$("start").onclick=()=>{if(mode==="end"){mode="idle";$("garage").hidden=false;$("offer").hidden=true;$("share").hidden=true;$("title").textContent="STREET RACING";$("desc").textContent="Выбери стиль своего праздника";$("start").textContent="На старт";return}start()};function finish(){mode="end";$("garage").hidden=true;$("offer").hidden=false;$("checkpoint").hidden=true;finalScore=Math.floor(dist);if(finalScore>record){record=finalScore;try{localStorage.setItem("tarStreet05",record)}catch{}}$("title").textContent=hp?"ФИНИШ!":"ГОНКА ОКОНЧЕНА";$("desc").textContent="Стиль "+models[model].pack+" / "+models[model].name+" • "+finalScore+" м • Уровень "+level+" • Рекорд: "+record+" м";$("start").textContent="Выбрать авто и повторить";$("start").hidden=false;$("share").hidden=false;$("overlay").hidden=false}
$("share").onclick=async()=>{let text="Мой результат TAR PLAY Street Racing: "+models[model].name+" / "+finalScore+" м. Попробуй обыграть меня! https://andtar86-ai.github.io/tar-play/street.html";try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);alert("Скопировано")}}catch(e){if(e.name!=="AbortError")prompt("Скопируй результат",text)}};function frame(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(mode==="run"){elapsedRun+=dt;boost=Math.max(0,boost-dt);hit=Math.max(0,hit-dt);energy=Math.min(100,energy+dt*4);let base=Math.min(310,180+(level-1)*15);let target=hit>0?65:boost>0?base+85:base;speed+=(target-speed)*Math.min(1,dt*3.5);dist+=speed/3.6*dt;let newLevel=1+Math.floor(dist/500);if(newLevel>level){level=newLevel;checkpointUntil=elapsedRun+2.2;$("checkpoint").textContent="CHECKPOINT "+(level-1)+" • УРОВЕНЬ "+level;} $("checkpoint").hidden=elapsedRun>=checkpointUntil;xlane+=(lane-xlane)*Math.min(1,dt*10);spawn-=dt;if(spawn<=0){spawn=Math.max(.36,1.15-(level-1)*.09)+Math.random()*.45;traffic.push({z:430,lane:Math.floor(Math.random()*3)-1,color:["#327aa5","#a73b4c","#b8bcc8"][Math.floor(Math.random()*3)],passed:false})}for(let o of traffic){let prev=o.z;o.z-=dt*(65+speed*.32);if(!o.passed&&prev>18&&o.z<=18){o.passed=true;if(Math.abs(o.lane-xlane)<.60&&hit<=0){hp--;hit=1.1;boost=0;speed=45}}}traffic=traffic.filter(o=>o.z>-40);if(hp<=0)finish()}$("speed").textContent=Math.round(speed);$("dist").textContent=Math.floor(dist);$("time").textContent=level;$("next").textContent="до КП "+Math.ceil(500-dist%500)+" м";$("charge").style.width=energy+"%";$("status").textContent="Жизни: "+("♥ ".repeat(hp))+" • Нитро: "+Math.floor(energy)+"%";$("nitro").disabled=mode!=="run"||energy<25||boost>0;scene();requestAnimationFrame(frame)}requestAnimationFrame(frame);
for(const key of ["lada","audi","mercedes","bmw"]){let m=models[key],b=document.createElement("button");b.type="button";b.dataset.car=key;b.setAttribute("aria-pressed",String(key===model));let cv=document.createElement("canvas");cv.width=240;cv.height=120;b.append(cv);let t=document.createElement("strong");t.textContent=m.name;b.append(t);let s=document.createElement("small");s.textContent=m.pack;b.append(s);$("cards").append(b);g=cv.getContext("2d");car(120,99,128,m.color,false,key);g=g0;b.onclick=()=>{model=key;document.querySelectorAll("#cards button").forEach(v=>v.setAttribute("aria-pressed",String(v.dataset.car===key)))}}
