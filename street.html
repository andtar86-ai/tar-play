<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>TAR PLAY Street Racing</title><style>*{box-sizing:border-box}body{margin:0;background:#080b12;color:white;font:16px system-ui;overscroll-behavior:none}main{max-width:650px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;color:#dfbd7a;font-weight:800;letter-spacing:2px}a{color:#dfbd7a}#stage{position:relative;height:min(65dvh,620px);min-height:240px;border:1px solid #353b49;border-radius:16px;overflow:hidden;margin:12px 0}canvas{width:100%;height:100%;display:block}#hud{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;font-size:13px;text-shadow:0 2px 4px black;pointer-events:none}#hud b{display:block;font-size:24px}#overlay{position:absolute;inset:0;display:grid;place-content:center;text-align:center;background:#090e18b8;padding:24px}#overlay[hidden]{display:none}h1{font-size:38px;line-height:1;margin:8px 0}p{color:#d2d8e3}button{border:0;border-radius:13px;background:#e5c58b;color:#17140e;font:700 19px system-ui;padding:16px;touch-action:manipulation;user-select:none}button:active{transform:scale(.96)}.controls{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:8px}.controls button{height:65px}.nitro{background:#186a9b;color:white}.meter{height:7px;background:#273041;border-radius:8px;overflow:hidden;margin:10px 0}.meter i{display:block;height:100%;background:#49dcff;width:100%}small{color:#b3bdcc}button:disabled{opacity:.45} @media(orientation:landscape) and (max-height:500px){main{max-width:none;display:grid;grid-template-columns:1fr 200px;gap:10px}header{grid-column:1/-1}#stage{height:76dvh;margin:0}.controls{grid-template-columns:1fr 1fr}.controls .nitro{grid-column:1/-1;grid-row:2}}#garage{display:grid;gap:8px;margin:0 0 12px}#garage[hidden]{display:none}select{font:inherit;color:white;background:#222c3c;border:1px solid #c8a96d; астёт.</p><div id="garage"><div id="cards" role="group" aria-label="Выбор автомобиля"></div><small>Одинаковая скорость у всех. Выбирай стиль.</small></div><button id="start">На старт</button><a id="offer" hidden href="https://andrei-tar.ru/" target="_blank" rel="noopener">Хочу такой праздник</a><button id="share" hidden style="margin-top:8px">Поделиться</button></div></div><div><div class="controls"><button id="left" aria-label="Влево">◀</button><button class="nitro" id="nitro">⚡ НИТРО</button><button id="right" aria-label="Вправо">▶</button></div><div class="meter"><i id="charge"></i></div><small id="status">Три полосы • 3 жизни • без ограничения времени</small></div></main><script>
"use strict";const $=id=>document.getElementById(id),c=$("c"),g0=c.getContext("2d");let g=g0;const models={bmw:{name:"BMW",color:"#2873ba",pack:"Люкс"},mercedes:{name:"Mercedes",color:"#b8c4ce",pack:"Премиум"},audi:{name:"Audi",color:"#bd283e",pack:"Классика"},lada:{name:"Lada Kalina",color:"#d9b36a",pack:"Лайт"}};let model="bmw",level=1,checkpointUntil=0,elapsedRun=0;let W=360,H=500,mode="idle",lane=0,xlane=0,speed=0,dist=0,remaining=30,energy=100,boost=0,hp=3,hit=0,traffic=[],spawn=0,last=0,record=0,runId=0,finalScore=0;try{record=+localStorage.getItem("tarStreet05")||0}catch{}function resize(){let b=c.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=b.width;H=b.height;c.width=Math.round(W*d);c.height=Math.round(H*d);g.setTransform(d,0,0,d,0,0)}window.addEventListener("resize",resize);resize();function poly(points,color){g.fillStyle=color;g.beginPath();points.forEach((p,i)=>i?g.lineTo(...p):g.moveTo(...p));g.closePath();g.fill()}function rect(x,y,w,h,col){g.fillStyle=col;g.fillRect(x,y,w,h)}function project(z,l){let t=1/(1+z/110),y=H*.29+t*H*.64,half=W*.49*t;return {x:W/2+l*half*.64,y,half,t}}function car(x,y,w,color,player,variant){let kind=variant||(player?model:"traffic");let h=w*.66;g.save();g.translate(x,y);g.scale(w/100,h/66);if(kind==="lada")g.scale(.88,1.12);if(kind==="mercedes")g.scale(1.04,.97);if(kind==="bmw")g.scale(1.08,.96);g.fillStyle="#0008";g.beginPath();g.ellipse(0,4,56,13,0,0,7);g.fill();rect(-49,-22,13,27,"#08090b");rect(36,-22,13,27,"#08090b");let shapes={bmw:[[-51,-8],[-50,-32],[-42,-41],[-30,-43],[-20,-60],[20,-60],[30,-43],[42,-41],[50,-32],[51,-8],[43,0],[-43,0]],mercedes:[[-48,-8],[-48,-28],[-43,-37],[-29,-42],[-18,-58],[18,-58],[29,-42],[43,-37],[48,-28],[48,-8],[39,0],[-39,0]],audi:[[-49,-8],[-48,-33],[-36,-43],[-26,-55],[-15,-62],[15,-62],[26,-55],[36,-43],[48,-33],[49,-8],[39,0],[-39,0]],lada:[[-46,-6],[-46,-39],[-37,-58],[-26,-65],[26,-65],[37,-58],[46,-39],[46,-6],[38,0],[-38,0]]};let paint=g.createLinearGradient(0,-65,0,0);paint.addColorStop(0,"#c1d9f0");paint.addColorStop(.28,color);paint.addColorStop(.68,color);paint.addColorStop(1,"#141b24");poly(shapes[kind]||shapes.bmw,paint);poly(kind==="lada"?[[-32,-36],[-28,-58],[28,-58],[32,-36]]:kind==="audi"?[[-33,-42],[-17,-58],[17,-58],[33,-42]]:[[-31,-43],[-19,-56],[19,-56],[31,-43]],"#101e2c");if(kind==="bmw"){rect(-43,-39,86,3,"#0c1017");rect(-35,-36,3,5,"#0c1017");rect(32,-36,3,5,"#0c1017")}if(kind==="lada"){rect(-29,-38,58,2,"#788597");rect(-5,-43,29,2,"#090d12")}if(kind==="mercedes"){rect(-31,-36,62,2,"#dbe3eb")}if(kind==="audi"){rect(-40,-38,80,2,"#c7cbd3")}poly([[-30,-43],[30,-43],[42,-35],[-42,-35]],"#ffffff30");poly([[-48,-32],[-28,-29],[28,-29],[48,-32],[45,-10],[-45,-10]],"#151923");g.shadowColor="#ff263c";g.shadowBlur=9; if(kind==="audi"){rect(-44,-28,88,4,"#ff334e")}else if(kind==="lada"){rect(-44,-31,12,19,"#ff334e");rect(32,-31,12,19,"#ff334e")}else if(kind==="mercedes"){poly([[-44,-30],[-15,-28],[-19,-21],[-44,-24]],"#ff334e");poly([[44,-30],[15,-28],[19,-21],[44,-24]],"#ff334e")}else{poly([[-44,-30],[-14,-30],[-14,-25],[-37,-25],[-37,-19],[-44,-19]],"#ff334e");poly([[44,-30],[14,-30],[14,-25],[37,-25],[37,-19],[44,-19]],"#ff334e")}g.shadowBlur=0;rect(-12,-19,24,9,"#c2c5cc");if(player){g.fillStyle="#161923";g.font="bold 5px sans-serif";g.textAlign="center";g.fillText(models[model].name==="Lada Kalina"?"LADA":models[model].name.toUpperCase(),0,-13)}rect(-42,-7,84,5,"#343943");if(kind==="lada"){rect(28,-4,10,4,"#a2aab5")}else{rect(-36,-4,10,4,"#a2aab5");rect(26,-4,10,4,"#a2aab5");if(kind==="bmw"){rect(-24,-4,8,4,"#a2aab5");rect(16,-4,8,4,"#a2aab5")}}if(player&&boost>0){poly([[-34,0],[-24,0],[-29,25+Math.random()*12]],"#50dfff");poly([[24,0],[34,0],[29,25+Math.random()*12]],"#50dfff")}g.restore()}function scene(){let sky=g.createLinearGradient(0,0,0,H*.5);sky.addColorStop(0,"#050916");sky.addColorStop(1,"#4e3157");rect(0,0,W,H,sky);let horizon=H*.29;for(let i=0;i<22;i++){let bw=W/19,bh=H*(.045+((i*43)%97)/650),x=i*bw-W*.05;rect(x,horizon-bh,bw-3,bh,"#10182a");for(let j=0;j<4;j++)for(let k=0;k<3;k++)if((i+j+k)%3===0)rect(x+4+k*bw*.23,horizon-bh+6+j*bh*.19,2,4,i%2?"#66b7d9":"#e0a66b")}rect(0,horizon,W,H-horizon,"#111925");poly([[W*.49,horizon],[W*.51,horizon],[W*1.1,H],[-W*.1,H]],"#272b36");for(let side of [-1,1]){poly([[W*.5+side*2,horizon],[W*.5+side*4,horizon],[W*.5+side*W*.55,H],[W*.5+side*W*.53,H]],"#a5a8a9")}let wet=g.createLinearGradient(0,horizon,0,H);wet.addColorStop(0,"#71628235");wet.addColorStop(1,"#111d3566");poly([[W*.49,horizon],[W*.51,horizon],[W*1.1,H],[-W*.1,H]],wet);for(let i=0;i<14;i++){let z=850-((i*64+dist*.9)%850),p=project(z,0);for(let side of [-1,1]){let x=p.x+side*p.half*.84;poly([[x-2*p.t,p.y],[x+2*p.t,p.y],[x+12*p.t,p.y+H*.12*p.t],[x-9*p.t,p.y+H*.12*p.t]],i%2?"#38b8ff24":"#eb529c20")}}let cz=500-dist%500;if(cz<430){let q=project(cz,0);rect(q.x-q.half,q.y-H*.32*q.t,4*q.t,H*.32*q.t,"#a0a8bb");rect(q.x+q.half,q.y-H*.32*q.t,4*q.t,H*.32*q.t,"#a0a8bb");rect(q.x-q.half,q.y-H*.32*q.t,q.half*2,22*q.t,"#b89650");g.fillStyle="#111";g.font="bold "+Math.max(5,14*q.t)+"px sans-serif";g.textAlign="center";g.fillText("CHECKPOINT "+level,q.x,q.y-H*.32*q.t+15*q.t)}let offset=(dist*1.2)%34;for(let z=900-offset;z>0;z-=34){let a=project(z,0),b=project(Math.max(0,z-16),0);for(let l of [-.5,.5])poly([[a.x+l*a.half*.64-1,a.y],[a.x+l*a.half*.64+1,a.y],[b.x+l*b.half*.64+2*b.t,b.y],[b.x+l*b.half*.64-2*b.t,b.y]],"#c7cbd3");let s=project(z,0);for(let side of [-1,1]){let px=s.x+side*s.half*1.08,ph=H*.16*s.t;rect(px,s.y-ph,Math.max(1,3*s.t),ph,"#626a78");rect(px-4*s.t,s.y-ph,12*s.t,3*s.t,"#79ddff")}}for(const o of [...traffic].sort((a,b)=>b.z-a.z)){let p=project(o.z,o.lane);car(p.x,p.y,W*.24*p.t,o.color,false)}let p=project(0,xlane);if(hit<=0||Math.floor(hit*12)%2===0)car(p.x+(hit>0?Math.sin(hit*50)*3:0),p.y+Math.sin(dist*.2)*1.5,W*.29,models[model].color,true);if(boost>0){g.strokeStyle="#64ddff77";for(let i=0;i<10;i++){let sx=i*W/9;g.beginPath();g.moveTo(W/2+(sx-W/2)*.65,H*.66);g.lineTo(sx,H);g.stroke()}}}
function move(d){if(mode==="run")lane=Math.max(-1,Math.min(1,lane+d))}function nitro(){if(mode==="run"&&energy>=25&&boost<=0){energy-=25;boost=2.3}}$("left").onclick=()=>move(-1);$("right").onclick=()=>move(1);$("nitro").onclick=nitro;window.addEventListener("keydown",e=>{if(["ArrowLeft","ArrowRight"," "].includes(e.key)){e.preventDefault();if(!e.repeat){if(e.key==="ArrowLeft")move(-1);else if(e.key==="ArrowRight")move(1);else nitro()}}});function start(){ $("offer").hidden=true;level=1;elapsedRun=0;checkpointUntil=0;$("checkpoint").hidden=true;$("garage").hidden=true;runId++;let token=runId;lane=xlane=0;speed=dist=0;remaining=30;hp=3;energy=100;boost=hit=0;traffic=[];spawn=.8;mode="count";$("share").hidden=true;$("start").hidden=true;$("overlay").hidden=false;$("desc").textContent="Приготовься";let n=3;$("title").textContent=n;function count(){if(token!==runId)return;if(--n>0){$("title").textContent=n;setTimeout(count,1000)}else{mode="run";$("overlay").hidden=true;last=performance.now()}}setTimeout(count,1000)}$("start").onclick=()=>{if(mode==="end"){mode="idle";$("garage").hidden=false;$("offer").hidden=true;$("share").hidden=true;$("title").textContent="STREET RACING";$("desc").textContent="Выбери стиль своего праздника";$("start").textContent="На старт";return}start()};function finish(){mode="end";$("garage").hidden=true;$("offer").hidden=false;$("checkpoint").hidden=true;finalScore=Math.floor(dist);if(finalScore>record){record=finalScore;try{localStorage.setItem("tarStreet05",record)}catch{}}$("title").textContent=hp?"ФИНИШ!":"ГОНКА ОКОНЧЕНА";$("desc").textContent="Стиль "+models[model].pack+" / "+models[model].name+" • "+finalScore+" м • Уровень "+level+" • Рекорд: "+record+" м";$("start").textContent="Выбрать авто и повторить";$("start").hidden=false;$("share").hidden=false;$("overlay").hidden=false}
$("share").onclick=async()=>{let text="Мой результат TAR PLAY Street Racing: "+models[model].name+" / "+finalScore+" м. Попробуй обыграть меня! https://andtar86-ai.github.io/tar-play/street.html";try{if(navigator.share)await navigator.share({text});else{await navigator.clipboard.writeText(text);alert("Скопировано")}}catch(e){if(e.name!=="AbortError")prompt("Скопируй результат",text)}};function frame(now){let dt=Math.min(.05,Math.max(0,(now-last)/1000));last=now;if(mode==="run"){elapsedRun+=dt;boost=Math.max(0,boost-dt);hit=Math.max(0,hit-dt);energy=Math.min(100,energy+dt*4);let base=Math.min(285,125+(level-1)*15);let target=hit>0?65:boost>0?base+85:base;speed+=(target-speed)*Math.min(1,dt*2);dist+=speed/3.6*dt;let newLevel=1+Math.floor(dist/500);if(newLevel>level){level=newLevel;checkpointUntil=elapsedRun+2.2;$("checkpoint").textContent="CHECKPOINT "+(level-1)+" • УРОВЕНЬ "+level;} $("checkpoint").hidden=elapsedRun>=checkpointUntil;xlane+=(lane-xlane)*Math.min(1,dt*10);spawn-=dt;if(spawn<=0){spawn=Math.max(.36,1.15-(level-1)*.09)+Math.random()*.45;traffic.push({z:430,lane:Math.floor(Math.random()*3)-1,color:["#327aa5","#a73b4c","#b8bcc8"][Math.floor(Math.random()*3)],passed:false})}for(let o of traffic){let prev=o.z;o.z-=dt*(65+speed*.27);if(!o.passed&&prev>18&&o.z<=18){o.passed=true;if(Math.abs(o.lane-xlane)<.60&&hit<=0){hp--;hit=1.1;boost=0;speed=45}}}traffic=traffic.filter(o=>o.z>-40);if(hp<=0)finish()}$("speed").textContent=Math.round(speed);$("dist").textContent=Math.floor(dist);$("time").textContent=level;$("next").textContent="до КП "+Math.ceil(500-dist%500)+" м";$("charge").style.width=energy+"%";$("status").textContent="Жизни: "+("♥ ".repeat(hp))+" • Нитро: "+Math.floor(energy)+"%";$("nitro").disabled=mode!=="run"||energy<25||boost>0;scene();requestAnimationFrame(frame)}requestAnimationFrame(frame);
for(const key of ["lada","audi","mercedes","bmw"]){let m=models[key],b=document.createElement("button");b.type="button";b.dataset.car=key;b.setAttribute("aria-pressed",String(key===model));let cv=document.createElement("canvas");cv.width=240;cv.height=120;b.append(cv);let t=document.createElement("strong");t.textContent=m.name;b.append(t);let s=document.createElement("small");s.textContent=m.pack;b.append(s);$("cards").append(b);g=cv.getContext("2d");car(120,99,128,m.color,false,key);g=g0;b.onclick=()=>{model=key;document.querySelectorAll("#cards button").forEach(v=>v.setAttribute("aria-pressed",String(v.dataset.car===key)))}}
